<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel</title>
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/map.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/geodata/worldLow.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
    <link rel="preload" href="fonts/Newsreader.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/Newsreader-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" /> <!-- Added Swiper CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body style="overflow-y: auto; margin: 0; padding: 0; width: 100vw; min-width: 0;">
    <div style="width: 100vw; max-width: 100vw; margin: 0; padding: 2rem 0 0 0; box-sizing: border-box;">
        <h1 style="font-size:2rem; font-family:serif; font-weight:600; margin-bottom:0.25em; text-align:center;">Akhil's Travel Map </h1>
        <p style="font-size:1rem; color:#666; text-align:center; margin-bottom:1.5em;">This is where I collect pics from places I have explored! Click on some countries to get started!</p>
        <div id="chartdiv" style="width: 100vw; max-width: 100vw; height: 500px; margin: 0 auto;"></div>
        <div id="photo-gallery" style="padding: 20px; width: 100vw; max-width: 100vw; box-sizing: border-box;"></div>
        <div id="countrySwiper" class="swiper" style="display: none; width: 100vw; max-width: 100vw; margin: 0 auto; transform: none;"> <!-- Full width -->
            <div class="swiper-wrapper">
                <!-- Slides will be populated by JavaScript -->
            </div>
            <div class="swiper-pagination"></div>
        </div>
    </div>
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script> <!-- Added Swiper JS -->
    <script src="script.js"></script>
</body>
<footer>
    <div class="footer-content">
        <!-- Replace with your site title -->
        <p>&copy; 2025 - Akhil B.</p>
    </div>
</footer>

</html>
