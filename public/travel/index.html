<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Akhil's Travel Map</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Same top bar as the main site (src/components/site-header.tsx) -->
    <header class="site-header">
        <div class="site-header-inner">
            <a class="site-brand" href="/">Akhil B</a>
            <nav class="site-nav">
                <a href="/#portfolio">Projects</a>
                <a href="https://" target="_blank" rel="noopener noreferrer">CV</a>
                <a href="/travel/index.html" aria-current="page">Travel</a>
                <a href="https://akhils-blogs.ghost.io" target="_blank" rel="noopener noreferrer">Blog</a>
            </nav>
        </div>
    </header>

    <main class="map-wrap" id="mapWrap">
        <div class="map-view" id="mapView">
            <canvas id="map" aria-label="Tile map of the world" role="img"></canvas>
            <div class="spots" id="spots"></div>
        </div>

        <div class="zoom-ctrl">
            <button id="zoomIn" aria-label="Zoom in" title="Zoom in (or scroll)">+</button>
            <button id="zoomOut" aria-label="Zoom out" title="Zoom out">&minus;</button>
            <button id="zoomReset" aria-label="Reset zoom" title="Reset zoom" hidden>&#8634;</button>
        </div>

        <footer>&copy; 2025 - Akhil B.</footer>

        <section class="win" id="win" hidden role="dialog" aria-labelledby="winName">
            <button class="win-close" id="winClose" aria-label="Close">&times;</button>
            <div class="win-img">
                <img id="winImg" alt="">
            </div>
            <div class="win-body">
                <div>
                    <strong id="winName"></strong>
                    <span id="winMeta"></span>
                </div>
                <div class="win-row">
                    <div class="win-nav" id="winNav">
                        <button id="winPrev" aria-label="Previous photo">&#8249;</button>
                        <span id="winCount"></span>
                        <button id="winNext" aria-label="Next photo">&#8250;</button>
                    </div>
                    <a class="win-maps" id="winMaps" target="_blank" rel="noopener" title="Open in Google Maps" aria-label="Open in Google Maps">
                        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                            <path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
                        </svg>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
