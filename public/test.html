<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Xterm.js Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.5.0/css/xterm.css" />
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }

    #terminal {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="terminal"></div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.5.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.9.0/lib/xterm-addon-fit.js"></script>
  <script src="enhanced-terminal.js"></script>
</body>

</html>
